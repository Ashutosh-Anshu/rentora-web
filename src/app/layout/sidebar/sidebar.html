<!-- Mobile backdrop, sirf tab dikhega jab sidebar open + mobile view -->
<div class="backdrop" [class.show]="sidebarStore.isSidebarOpen()" (click)="closeSidebar()"></div>

<aside class="sidebar" [class.closed]="!sidebarStore.isSidebarOpen()">
    <div class="flex flex-col h-full overflow-hidden">

        <div class="logo-row">
            <img src="/logo/rentora_logo.png" alt="Rentora Logo" class="h-8 w-auto" />
            <span class="logo-text">Rentora</span>
        </div>

        <nav class="menu-scroll">
            <ul class="menu-list">
                @for (menu of menus(); track menu.id) {
                <li>
                    @if (menu.children.length === 0) {
                    <a pRipple [routerLink]="menu.route" routerLinkActive="active" class="menu-item"
                        (click)="onMenuClick()">
                        <span>{{ menu.displayName }}</span>
                    </a>
                    } @else {
                    <a pRipple (click)="toggleExpand(menu.id)" class="menu-item"
                        [class.expanded]="expandedId() === menu.id">
                        <span>{{ menu.displayName }}</span>
                        <i class="pi pi-angle-down chevron"></i>
                    </a>

                    <ul class="submenu" [class.open]="expandedId() === menu.id">
                        <div class="submenu-inner">
                            @for (child of menu.children; track child.id) {
                            <li>
                                <a pRipple [routerLink]="child.route" routerLinkActive="active"
                                    class="menu-item submenu-item" (click)="onMenuClick()">
                                    <span>{{ child.displayName }}</span>
                                </a>
                            </li>
                            }
                        </div>
                    </ul>
                    }
                </li>
                }
            </ul>
        </nav>

    </div>
</aside>
